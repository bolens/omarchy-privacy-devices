name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    name: Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out Omarchy validator and shell imports
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: basecamp/omarchy
          path: .omarchy

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq shellcheck

      - name: Validate plugin manifest
        run: |
          mkdir "$RUNNER_TEMP/plugin"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/plugin"
          .omarchy/bin/omarchy-plugin-validate "$RUNNER_TEMP/plugin"

      - name: Lint QML
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            archlinux@sha256:4bf33b21a715aac0b48ce6e9eaed4782a898eae96f88f5da3635572129c2584a \
            bash -lc 'pacman -Syu --noconfirm quickshell qt6-declarative >/dev/null && /usr/lib/qt6/bin/qmllint -I .omarchy/shell BarWidget.qml Service.qml'

      - name: Check shell scripts
        run: shellcheck privacy-control privacy-deps privacy-recording privacy-screenshot

      - name: Run model tests
        run: node tests/model.test.js

      - name: Run security tests
        run: node tests/security.test.js

  repository:
    name: Repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install document validators
        run: |
          sudo apt-get update
          sudo apt-get install --yes libxml2-utils ruby tidy

      - name: Validate issue forms
        run: ruby scripts/validate-issue-forms.rb

      - name: Validate HTML and XML
        run: |
          tidy -errors -quiet docs/index.html docs/404.html 2>&1 | tee /tmp/tidy-output
          ! grep -E "Error:" /tmp/tidy-output
          xmllint --noout docs/favicon.svg docs/sitemap.xml

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --accept 200,204,206,429
            './**/*.md'
            './docs/**/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
