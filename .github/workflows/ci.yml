name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  plugin:
    name: Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out Omarchy validator and shell imports
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: basecamp/omarchy
          path: .omarchy

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq shellcheck

      - name: Validate plugin manifest
        run: |
          mkdir "$RUNNER_TEMP/plugin"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/plugin"
          .omarchy/bin/omarchy-plugin-validate "$RUNNER_TEMP/plugin"

      - name: Inspect release archive
        run: |
          archive_files=$(git archive HEAD | tar -t)
          if grep -E '(^|/)(__pycache__|node_modules|\.pytest_cache)(/|$)|\.py[co]$|\.tar\.gz(\.sha256)?$' <<<"$archive_files"; then
            echo "Release archive contains generated or forbidden files" >&2
            exit 1
          fi
          if grep -E '^(\.github|scripts|tests)/|^Runtime.*Test\.qml$|^package(-lock)?\.json$' <<<"$archive_files"; then
            echo "Release archive contains maintainer-only files" >&2
            exit 1
          fi
          if git grep -IlE -- 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}' -- .; then
            echo "Tracked files contain credential-like material" >&2
            exit 1
          fi

      - name: Lint QML
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            archlinux@sha256:4bf33b21a715aac0b48ce6e9eaed4782a898eae96f88f5da3635572129c2584a \
            bash -lc 'pacman -Syu --noconfirm quickshell qt6-declarative >/dev/null && /usr/lib/qt6/bin/qmllint -I .omarchy/shell BarWidget.qml Service.qml SettingsSurface.qml IntegerSetting.qml PrivacyActivityCard.qml PrivacyMessageSurface.qml PrivacySettingToggle.qml DeviceSettingsEditor.qml DeviceDiagnostics.qml AudioEndpointSettings.qml PrivacyGeneralSettings.qml PrivacyAppearanceSettings.qml PrivacyAlertsSettings.qml PrivacyMonitoringSettings.qml PrivacyMarkerGlyphEditor.qml PrivacySettingsNavigation.qml PrivacyConfirmationController.qml PrivacySettingsTransferController.qml PrivacySettingsTransferResult.qml PrivacySettingsMutationController.qml RuntimeModelTest.qml RuntimeSettingsNavigationTest.qml RuntimeConfirmationTest.qml RuntimeObserverLifecycleTest.qml RuntimeObserverRecoveryTest.qml RuntimeSettingsTransferTest.qml RuntimeSettingsTransferFailureTest.qml RuntimeSettingsTransferResultTest.qml RuntimeSettingsMutationTest.qml RuntimeSettingToggleTest.qml RuntimeAppearanceSettingsTest.qml RuntimeDeepLinkTest.qml RuntimeAudioEndpointSettingsTest.qml RuntimeBarSemanticColorTest.qml RuntimeActivityCardStateTest.qml RuntimeLockdownButtonTest.qml RuntimeDeviceSettingsNavigationTest.qml RuntimeSettingsRollbackTest.qml RuntimeDeviceDiagnosticsTest.qml RuntimeMonitoringActionsTest.qml RuntimeActivityPolicyActionsTest.qml RuntimePrivateDataActionsTest.qml RuntimeHistoryViewTest.qml RuntimeDeviceAppearanceMutationTest.qml RuntimeGeneralSettingsTest.qml RuntimeAlertsSettingsTest.qml RuntimePluginSmokeTest.qml'

      - name: Install test dependencies
        run: npm ci

      - name: Run behavior suite
        run: tests/run_all.sh

  repository:
    name: Repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install document validators
        run: |
          sudo apt-get update
          sudo apt-get install --yes libxml2-utils ruby tidy

      - name: Validate issue forms
        run: ruby scripts/validate-issue-forms.rb

      - name: Validate release metadata
        run: node tests/release.test.js

      - name: Validate documentation structure
        run: npm run test:docs

      - name: Validate HTML and XML
        run: |
          tidy -errors -quiet docs/index.html docs/404.html 2>&1 | tee /tmp/tidy-output
          if grep -E "Error:" /tmp/tidy-output; then exit 1; fi
          xmllint --noout docs/favicon.svg docs/sitemap.xml

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --accept 200,204,206,429
            --exclude '^https://github\.com/bolens/omarchy-privacy-devices/compare/'
            './**/*.md'
            './docs/**/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install site test dependencies
        run: npm ci

      - name: Build and test site
        run: |
          npm run build:site
          npm run test:site

      - name: Audit site accessibility
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >/tmp/privacy-devices-site.log 2>&1 &
          site_server=$!
          trap 'kill "$site_server" 2>/dev/null || true' EXIT
          npx lighthouse http://127.0.0.1:4173/ --only-categories=accessibility --chrome-flags="--headless --no-sandbox" --output=json --output-path=/tmp/lighthouse.json
          node -e 'const report = require("/tmp/lighthouse.json"); const score = report.categories.accessibility.score; console.log("accessibility score:", score); process.exit(score >= 0.95 ? 0 : 1)'
