name: Omarchy compatibility

on:
  schedule:
    - cron: "41 8 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Supported Omarchy v4.0.1
            omarchy-ref: 13f18b2cb7286fb54f87daf571a031aa6af3d8f0
            experimental: false
          - name: Omarchy quattro canary
            omarchy-ref: quattro
            experimental: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: omacom/omarchy
          ref: ${{ matrix.omarchy-ref }}
          path: .omarchy
          persist-credentials: false
      - name: Run behavior and QML checks
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/source:ro" \
            --tmpfs /workspace:rw,exec,nosuid,size=512m --workdir /workspace \
            ghcr.io/bolens/omarchy-plugin-ci@sha256:af5a6ae41d7c531e18fc0a2f260af8abafa4b0f5e5c9b224fda9f86d3af84b6b \
            bash -lc 'cp -a /source/. /workspace && npm ci --ignore-scripts && QMLLINT=/usr/lib/qt6/bin/qmllint OMARCHY_PATH=.omarchy bash scripts/with-qml-imports.sh .omarchy/shell bash -c "tests/run_all.sh && scripts/lint-qml"'
