version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    groups:
      site-tooling:
        dependency-type: development
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
