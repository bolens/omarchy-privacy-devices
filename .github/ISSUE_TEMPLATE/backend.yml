name: Backend or dependency problem
description: Report installation, screenshot, recording, audio, or control backend failures.
title: "[Backend]: "
labels: [bug, backend]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I updated the plugin and searched existing issues.
          required: true
        - label: I installed the dependencies shown in the plugin settings or user guide.
          required: true

  - type: dropdown
    id: backend-area
    attributes:
      label: Backend or control
      options:
        - pactl audio control
        - wpctl audio control
        - UVC camera blocking
        - GeoClue location blocking
        - Hyprland screen-share blocking
        - Omarchy screenshot
        - Grim screenshot
        - Grim + Satty screenshot
        - Hyprshot screenshot
        - Flameshot screenshot
        - Omarchy / GPU Screen Recorder
        - wf-recorder
        - Custom screenshot command
        - Custom recording command
        - Plugin installation or update
    validations:
      required: true

  - type: textarea
    id: failure
    attributes:
      label: What failed?
      description: Include the action taken, actual result, and expected result.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependency versions
      description: List relevant commands or packages and their versions.
      placeholder: |
        wpctl --version: …
        wf-recorder --version: …

  - type: input
    id: omarchy-version
    attributes:
      label: Omarchy version
      description: Run `omarchy version` and paste the result.
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Find this in `manifest.json` inside the installed plugin directory.
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Error output
      description: Paste the complete relevant error after removing sensitive paths or data.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include backend selection, relevant configuration, and screenshots if useful.
