<!doctype html>
<html lang="en" data-default-theme="tokyo-night" data-theme-storage="privacy-devices-theme">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="4; url=https://bolens.github.io/omarchy-privacy-devices/">
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://bolens.github.io/omarchy-privacy-devices/">
    <link rel="icon" href="https://bolens.github.io/omarchy-privacy-devices/favicon.svg" type="image/svg+xml">
    <title>Page not found · Privacy Devices</title>
    <script>
      const root = document.documentElement;
      let requested = null;
      let saved = null;
      try { requested = new URLSearchParams(location.search).get("theme"); } catch {}
      try { saved = root.dataset.themeStorage ? localStorage.getItem(root.dataset.themeStorage) : null; } catch {}
      const preference = requested || saved || "system";
      const prefersLight = typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: light)").matches;
      const hour = new Date().getHours();
      root.dataset.themePreference = preference;
      root.dataset.theme = preference === "system" ? (prefersLight ? "github-light" : root.dataset.defaultTheme)
        : preference === "time" ? (hour >= 7 && hour < 19 ? "github-light" : root.dataset.defaultTheme) : preference;
    </script>
    <style>
      :root { color-scheme: dark; --background: #0c0e0c; --text: #f2f4ed; --muted: #a8afa2; --accent: #b9f27c; }
      [data-theme="github-light"], [data-theme="catppuccin-latte"], [data-theme="solarized-light"] { color-scheme: light; --background: #fff; --text: #1f2328; --muted: #59636e; --accent: #0969da; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: var(--background); color: var(--text); font: 1rem/1.6 ui-monospace, monospace; }
      main { width: min(34rem, calc(100% - 2rem)); }
      p { color: var(--muted); }
      a { color: var(--accent); text-underline-offset: 0.2em; }
    </style>
  </head>
  <body>
    <main>
      <p>404</p>
      <h1>That page isn’t here.</h1>
      <p>Returning to Privacy Devices in a few seconds. <a href="https://bolens.github.io/omarchy-privacy-devices/">Go home now</a>.</p>
    </main>
  </body>
</html>
