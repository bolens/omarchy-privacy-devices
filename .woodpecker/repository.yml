# Credential-free repository policy; existing hosted checks remain during proof.
labels:
  platform: linux/amd64
  backend: docker
clone:
  git:
    image: docker.io/woodpeckerci/plugin-git@sha256:9802cb7852dcf31f9c5c1d1ddeadfb9002d4fae85751f7b6a792eedb267bcc59
    settings:
      depth: 0
      partial: false
when:
  - event: push
    branch: main
  - event: [pull_request, manual]
steps:
  - name: source-and-workflow-policy
    image: node:26-trixie@sha256:6d2c7d5d074bf72f81ddc252b4fbb5d625bc028eeda49cb4b8c2ff8eda1ee617
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates python3 python3-venv shellcheck
      - bash scripts/woodpecker-repository.sh --policy
  - name: repository-documents
    image: node:26-trixie@sha256:6d2c7d5d074bf72f81ddc252b4fbb5d625bc028eeda49cb4b8c2ff8eda1ee617
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates python3 libxml2-utils tidy ruby
      - bash scripts/woodpecker-repository.sh --documents
