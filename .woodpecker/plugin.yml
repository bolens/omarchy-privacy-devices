# Public, credential-free validation; no host mounts or Docker socket.
labels:
  platform: linux/amd64
  backend: docker
clone:
  git:
    image: docker.io/woodpeckerci/plugin-git@sha256:9802cb7852dcf31f9c5c1d1ddeadfb9002d4fae85751f7b6a792eedb267bcc59
    settings:
      depth: 0
      partial: false
when:
  - event: push
    branch: main
  - event: [pull_request, manual]
steps:
  - name: prepare
    image: ghcr.io/bolens/omarchy-plugin-ci@sha256:af5a6ae41d7c531e18fc0a2f260af8abafa4b0f5e5c9b224fda9f86d3af84b6b
    commands:
      - bash scripts/woodpecker-plugin.sh --prepare
  - name: plugin
    image: ghcr.io/bolens/omarchy-plugin-ci@sha256:af5a6ae41d7c531e18fc0a2f260af8abafa4b0f5e5c9b224fda9f86d3af84b6b
    # Woodpecker 3.x reads network mode from the direct step field.
    network_mode: none
    backend_options:
      docker:
        user: '10042:10042'
    environment:
      CI: 'true'
    commands:
      - bash scripts/woodpecker-plugin.sh --offline
