# Public, credential-free validation; no host mounts or Docker socket.
labels:
  platform: linux/amd64
  backend: docker
clone:
  git:
    image: docker.io/woodpeckerci/plugin-git@sha256:9802cb7852dcf31f9c5c1d1ddeadfb9002d4fae85751f7b6a792eedb267bcc59
    settings:
      depth: 0
      partial: false
when:
  - event: push
    branch: main
  - event: [pull_request, manual]
steps:
  - name: plugin
    image: ghcr.io/bolens/omarchy-plugin-ci@sha256:293b0457198085de5df26519dd4aa336202495c080d253b71ac30e7d8e8d3851
    environment:
      CI: 'true'
    commands:
      - bash scripts/woodpecker-plugin.sh
